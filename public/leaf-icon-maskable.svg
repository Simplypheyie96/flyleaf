<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2e4f8"/>
      <stop offset="1" stop-color="#e9f6fb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- The same path and the same 0.78 as leaf-icon.svg — see that file. The
       tile is square to the edges here, because a launcher applies its own mask
       and a rounded corner under a rounded mask leaves a pale sliver.

       It clears the maskable safe zone, and the rosette clears it more easily
       than the book it replaced, because a radial mark has the same reach in
       every direction. Its farthest point is a petal tip 198.4 from centre,
       which at 0.78 sits 154.8 out, against the 204.8 radius (40% of 512) that
       an aggressive circular mask is allowed to crop to. No launcher can clip
       a petal. -->
  <g transform="translate(256 256) scale(0.78) translate(-256 -256)">
    <path fill="#1b2431"
          d="M256 57.6 A74.67 59.73 -90 1 1 256 206.93 A74.67 59.73 -90 1 1 256 57.6 Z
             M444.69 194.69 A74.67 59.73 -18 1 1 302.66 240.85
             A74.67 59.73 -18 1 1 444.69 194.69 Z
             M372.61 416.51 A74.67 59.73 54 1 1 284.84 295.68
             A74.67 59.73 54 1 1 372.61 416.51 Z
             M139.39 416.51 A74.67 59.73 126 1 1 227.16 295.68
             A74.67 59.73 126 1 1 139.39 416.51 Z
             M67.31 194.69 A74.67 59.73 198 1 1 209.34 240.85
             A74.67 59.73 198 1 1 67.31 194.69 Z
             M217.6 256 A38.4 38.4 0 1 1 294.4 256 A38.4 38.4 0 1 1 217.6 256 Z"/>
  </g>
</svg>
