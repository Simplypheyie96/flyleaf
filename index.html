<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Two icons, in this order on purpose. A browser that understands SVG
         takes the second and scales it crisply at any size; everything else
         falls back to the .ico, which carries real 48/32/16 bitmaps rather
         than letting something downsample a 512px tile to a smudge.

         The .ico is also what gets fetched when nothing asks: browsers, feed
         readers and link unfurlers request /favicon.ico blind, and without the
         file that is a 404 on every cold load.

         No dark-mode variant, deliberately: the mark sits on its own opaque
         sky tile, so it reads on light and dark browser chrome alike. A
         transparent favicon is the thing that needs two versions. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/leaf-icon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- `interactive-widget=resizes-content` asks the browser to shrink the
         page itself when the keyboard opens, which is what Chrome and Android
         WebView do with it and is by far the cleanest fix for a sheet being
         shoved off screen. Safari ignores it, so Sheet.tsx measures the visual
         viewport by hand for iOS; this line means Android never needs that
         path. No `maximum-scale` — capping zoom fails WCAG. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#c2e4f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c2338" />
    <!-- The name first, then what it is. Optimized for search queries like:
         "private reading journal", "goodreads alternative", "book tracker", "export reading log". -->
    <title>Flyleaf — Private Reading Journal, Book Tracker & Goodreads Alternative</title>
    <meta
      name="description"
      content="Flyleaf is a private reading journal and book tracker app. Keep quotes, notes, voice memos, and photos from every book you read. 100% offline, private, and exportable as PDF."
    />
    <meta
      name="keywords"
      content="reading journal, book tracker, goodreads alternative, private reading log, book notes app, readwise alternative, offline book journal, voice notes book tracker, pdf reading log export"
    />

    <!-- EVERY ABSOLUTE URL BELOW POINTS AT ONE HOST, AND THE HOST IS THE APEX. -->
    <link rel="canonical" href="https://flyleaf.cc/" />

    <!-- Open Graph for Facebook, WhatsApp, iMessage, and Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flyleaf" />
    <meta property="og:url" content="https://flyleaf.cc/" />
    <meta property="og:title" content="Flyleaf — Private Reading Journal & Book Tracker" />
    <meta
      property="og:description"
      content="Keep quotes, notes, voice memos, and photographs from every book you read. Private by default, works offline, and exports complete paginated journals to PDF."
    />
    <meta property="og:image" content="https://flyleaf.cc/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Flyleaf reading journal cards — handwritten quotes, photos, and voice notes beside the words: a private journal for the books you read."
    />
    <meta property="og:locale" content="en_GB" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flyleaf — Private Reading Journal & Book Tracker" />
    <meta
      name="twitter:description"
      content="Keep quotes, notes, voice memos, and photographs from every book you read. Private by default, works offline, and exports to PDF."
    />
    <meta name="twitter:image" content="https://flyleaf.cc/og.jpg" />

    <!-- Googlebot & Search Engine Structured Data (Schema.org) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Flyleaf",
        "alternateName": "Flyleaf Reading Journal",
        "url": "https://flyleaf.cc/",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Any",
        "description": "A private reading journal and book tracker app. Keep quotes, notes, voice note transcriptions, and photographs from every book, stored 100% offline on your own device.",
        "featureList": [
          "Private book tracking",
          "Voice note transcriptions",
          "Offline first storage",
          "PDF journal export",
          "Keepsake quote generator"
        ],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <script>
      /* Set the theme before first paint to avoid a flash of the wrong mode. */
      try {
        var pref = localStorage.getItem('flyleaf-theme')
        var dark =
          pref === 'dark' ||
          (pref !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- Fallback content for search engine crawlers (Googlebot / Bingbot) that index static HTML before JS executes -->
    <noscript>
      <main style="padding: 2rem; max-width: 680px; margin: 0 auto; font-family: sans-serif; line-height: 1.6; color: #1c2338;">
        <h1>Flyleaf — Private Reading Journal &amp; Book Tracker</h1>
        <p>
          Flyleaf is a private reading journal app designed for book lovers, readers, and thinkers.
          Keep quotes, personal notes, voice note recordings with transcriptions, and photographs from every book you read.
        </p>
        <h2>Key Features:</h2>
        <ul>
          <li><strong>Private &amp; Offline First:</strong> All your reading memories stay strictly on your device.</li>
          <li><strong>Goodreads &amp; Readwise Alternative:</strong> Track your books without public feeds or algorithmic noise.</li>
          <li><strong>Voice Note Transcriptions:</strong> Speak your reflections out loud and get them transcribed automatically.</li>
          <li><strong>PDF Journal Export:</strong> Print or save your complete paginated reading journal as a PDF.</li>
          <li><strong>Keepsake Generator:</strong> Turn memorable quotes into beautiful shareable cards.</li>
        </ul>
        <p><a href="https://flyleaf.cc/">Open Flyleaf App</a></p>
      </main>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
