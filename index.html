<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/leaf-icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- `interactive-widget=resizes-content` asks the browser to shrink the
         page itself when the keyboard opens, which is what Chrome and Android
         WebView do with it and is by far the cleanest fix for a sheet being
         shoved off screen. Safari ignores it, so Sheet.tsx measures the visual
         viewport by hand for iOS; this line means Android never needs that
         path. No `maximum-scale` — capping zoom fails WCAG. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#c2e4f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c2338" />
    <title>Flyleaf</title>
    <script>
      /* Set the theme before first paint to avoid a flash of the wrong mode. */
      try {
        var pref = localStorage.getItem('flyleaf-theme')
        var dark =
          pref === 'dark' ||
          (pref !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
