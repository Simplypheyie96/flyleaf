<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Flyleaf Journal feature graphic</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{background:#cfccc6;padding:24px;display:grid;gap:24px;justify-content:center;font-family:"Quicksand",system-ui,sans-serif}
.fg{width:1024px;height:500px;position:relative;overflow:hidden;color:oklch(0.25 0.015 255)}
.lock{display:flex;align-items:center;gap:14px}
.ic{flex:none;fill:currentColor;width:52px;height:52px}
img.ic{border-radius:12px}
.name{font-family:"EB Garamond",Georgia,serif;font-weight:600;font-size:52px;line-height:1;letter-spacing:-.015em}
.in{position:absolute;left:64px;top:0;bottom:0;width:360px;display:flex;flex-direction:column;justify-content:center;gap:22px}
.in p{font-size:23px;font-weight:500;line-height:1.35;color:oklch(0.44 0.02 255)}
.ph{position:absolute;border-radius:30px;border:6px solid #1d2233;box-shadow:0 0 0 1px rgba(255,255,255,.18),0 24px 48px rgba(10,10,20,.28)}
/* A · one big phone, a real piece of it lifted out */
.a{background:linear-gradient(180deg,oklch(0.9 0.045 235),oklch(0.965 0.015 225))}
.a .hero{left:660px;top:56px;width:300px}
.a .float{position:absolute;left:452px;bottom:44px;width:300px;border-radius:14px;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 18px 36px rgba(10,10,20,.22);transform:rotate(-3deg);z-index:2}
/* B · three phones fanned */
.b{background:linear-gradient(180deg,oklch(0.26 0.04 268),oklch(0.19 0.022 266));color:oklch(0.92 0.012 250)}.b .in p{color:oklch(0.8 0.05 262)}
.b .ph{width:208px}
.p1{left:470px;top:96px;transform:rotate(-6deg)}
.p2{left:640px;top:48px;z-index:2}
.p3{left:786px;top:110px;transform:rotate(6deg)}
/* C · brand strip over four phones */
.c{background:linear-gradient(180deg,oklch(0.9 0.045 235),oklch(0.965 0.015 225))}
.strip{position:absolute;left:0;right:0;top:0;height:96px;background:oklch(0.22 0.03 267);color:oklch(0.92 0.012 250);display:flex;align-items:center;justify-content:space-between;padding:0 64px}
.strip .ic{width:40px;height:40px}.strip .name{font-size:36px}
.strip>span{font-family:"Quicksand",system-ui,sans-serif;font-size:14px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.c .ph{width:200px;top:132px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><symbol id="mark" viewBox="0 0 512 512"><path d="M256 57.6 A74.67 59.73 -90 1 1 256 206.93 A74.67 59.73 -90 1 1 256 57.6 Z M444.69 194.69 A74.67 59.73 -18 1 1 302.66 240.85 A74.67 59.73 -18 1 1 444.69 194.69 Z M372.61 416.51 A74.67 59.73 54 1 1 284.84 295.68 A74.67 59.73 54 1 1 372.61 416.51 Z M139.39 416.51 A74.67 59.73 126 1 1 227.16 295.68 A74.67 59.73 126 1 1 139.39 416.51 Z M67.31 194.69 A74.67 59.73 198 1 1 209.34 240.85 A74.67 59.73 198 1 1 67.31 194.69 Z M217.6 256 A38.4 38.4 0 1 1 294.4 256 A38.4 38.4 0 1 1 217.6 256 Z"/></symbol></svg>
<section class="fg a" id="a"><div class="in"><div class="lock "><svg class="ic"><use href="#mark"/></svg><span class="name">Flyleaf Journal</span></div><p>Your own page in every book you read.</p></div><img class="ph hero" src="jn-1.jpg" alt=""><img class="float" src="jn-float.jpg" alt=""></section>
<section class="fg b" id="b"><div class="in"><div class="lock "><svg class="ic"><use href="#mark"/></svg><span class="name">Flyleaf Journal</span></div><p>Your own page in every book you read.</p></div><img class="ph p1" src="jn-3.jpg" alt=""><img class="ph p2" src="jn-1.jpg" alt=""><img class="ph p3" src="jn-5.jpg" alt=""></section>
<section class="fg c" id="c"><div class="strip"><div class="lock "><svg class="ic"><use href="#mark"/></svg><span class="name">Flyleaf Journal</span></div><span>Quotes · notes · a library of your own</span></div><img class="ph" style="left:64px" src="jn-3.jpg" alt=""><img class="ph" style="left:296px" src="jn-1.jpg" alt=""><img class="ph" style="left:528px" src="jn-4.jpg" alt=""><img class="ph" style="left:760px" src="jn-2.jpg" alt=""></section>
</body></html>
